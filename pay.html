<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pay Your Order | Studio One Hair Design</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="canonical" href="https://www.studioonefresno.com/pay">
  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link href="https://use.typekit.net/epq0gor.css" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://use.typekit.net/epq0gor.css" rel="stylesheet"></noscript>
  <!-- reCAPTCHA v3 (shared WES key) — used only to notify Studio One that a link was paid -->
  <script src="https://www.google.com/recaptcha/api.js?render=6Lck8aQsAAAAALMA-T6nwfkSf7bv4K-mOhkszeKh" async defer></script>
  <!-- PayPal SDK — same live client-id as the shop; PayPal / Venmo / any card -->
  <script src="https://www.paypal.com/sdk/js?client-id=AW4HfPBgoAi0ej4WYNWCyFbvm8eKoO3tKuvUrL5YVbD5MZu-nOsaInJxJDLiOfRErgnjtieDEC73lhux&currency=USD&intent=capture&enable-funding=venmo&components=buttons" data-sdk-integration-source="pay"></script>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    :root{--olive:#4c5223;--olive-light:#6b7332;--black:#000;--dark:#0a0a0a;--white:#fff;--off-white:#f5f5f5;--light-gray:#d9d9d9;--body-font:Arial,sans-serif;--heading-font:'freight-big-pro',Georgia,serif}
    html{-webkit-font-smoothing:antialiased}
    body{font-family:var(--body-font);background:var(--black);color:var(--light-gray);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
    .card{width:100%;max-width:440px;text-align:center}
    .card .logo{height:34px;margin:0 auto 36px;display:block}
    .eyebrow{font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--olive-light);margin-bottom:14px}
    h1{font-family:var(--heading-font);font-size:34px;font-weight:400;color:var(--white);line-height:1.15;margin-bottom:10px}
    .for{font-size:14px;color:var(--light-gray);font-weight:300;line-height:1.6;margin-bottom:26px}
    .amount-box{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:22px;margin-bottom:26px}
    .amount-box .lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--off-white);font-weight:600;margin-bottom:8px}
    .amount-box .amt{font-family:var(--heading-font);font-size:44px;color:var(--white);font-weight:400;line-height:1}
    #paypal-button-container{min-height:52px}
    .msg{margin-top:18px;font-size:14px;line-height:1.6;padding:14px 16px;border-radius:4px;display:none;text-align:left}
    .msg.err{display:block;background:rgba(190,60,60,.14);border:1px solid rgba(190,60,60,.4);color:#ffb3b3}
    .msg.ok{display:block;background:rgba(76,82,35,.16);border:1px solid rgba(76,82,35,.5);color:#cfe0a8;text-align:center}
    .foot-note{margin-top:26px;font-size:12px;color:#7a7a6a;line-height:1.6}
    .foot-note a{color:var(--olive-light)}
  </style>
  <!-- myaieditor inline-edit loader (no-op for real visitors) -->
  <script src="/mae-edit-loader.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <main id="main">
  <div class="card">
    <a href="/"><img src="/images/optimized/logo.avif" alt="Studio One Hair Design" class="logo" width="180" height="34"></a>
    <p class="eyebrow">Secure Payment</p>
    <h1>Pay Your Order</h1>
    <p class="for" id="forLine">Studio One Hair Design</p>
    <div class="amount-box" id="amountBox">
      <div class="lbl">Amount due</div>
      <div class="amt" id="amt">$0.00</div>
    </div>
    <div id="paypal-button-container"></div>
    <div class="msg" id="msg"></div>
    <p class="foot-note">Secure checkout by PayPal &mdash; pay with PayPal, Venmo, or any credit/debit card. Questions? Text <a href="sms:5597959724">559-795-9724</a>.</p>
  </div></main>


  <script>
  (function(){
    var RC_KEY='6Lck8aQsAAAAALMA-T6nwfkSf7bv4K-mOhkszeKh';
    var msg=document.getElementById('msg');
    function show(t,ok){ msg.textContent=t; msg.className='msg '+(ok?'ok':'err'); }
    function showHTML(h,ok){ msg.innerHTML=h; msg.className='msg '+(ok?'ok':'err'); }

    var qs=new URLSearchParams(location.search);
    var rawAmt=(qs.get('amount')||'').replace(/[^0-9.]/g,'');
    var amount=parseFloat(rawAmt);
    var forLabel=(qs.get('for')||'').slice(0,120);
    var ref=(qs.get('ref')||'').slice(0,120);

    if(forLabel){ document.getElementById('forLine').textContent=forLabel; }

    // Validate the amount from the link
    if(!(amount>0) || amount>100000){
      document.getElementById('amountBox').style.display='none';
      document.getElementById('paypal-button-container').style.display='none';
      show('This payment link is missing a valid amount. Please ask Studio One to resend it, or text 559-795-9724.', false);
      return;
    }
    var value=amount.toFixed(2);
    document.getElementById('amt').textContent='$'+value;
    document.title='Pay $'+value+' | Studio One Hair Design';

    function notifyStudioOne(details){
      // Best-effort heads-up to Studio One that the link was paid (PayPal also emails them).
      // A blocked/slow reCAPTCHA must NOT swallow the notification: time out at
      // 8s and post with an empty token (form-notify parks it as
      // missing_recaptcha_token, recoverable from the admin Spam tab).
      try{
        Promise.race([
          new Promise(function(resolve){
            if(!window.grecaptcha){ resolve(''); return; }
            grecaptcha.ready(function(){
              grecaptcha.execute(RC_KEY,{action:'wholesale_payment'}).then(resolve,function(){ resolve(''); });
            });
          }),
          new Promise(function(resolve){ setTimeout(function(){ resolve(''); },8000); })
        ]).catch(function(){ return ''; }).then(function(token){
          var payer=(details.payer&&details.payer.name)?((details.payer.name.given_name||'')+' '+(details.payer.name.surname||'')).trim():'';
          var email=(details.payer&&details.payer.email_address)||'';
          var parts=(forLabel||payer).split(/\s+/);
          return fetch('https://myaieditor.com/api/form-notify',{
            method:'POST',headers:{'Content-Type':'application/json'},
            body:JSON.stringify({
              site_slug:'studio-one',
              form_type:'wholesale_payment',
              recaptcha_token:token||'',
              first_name:parts[0]||'',
              last_name:parts.slice(1).join(' '),
              email:email,
              amount:'$'+value,
              paid:'true',
              paypal_order_id:details.id||'',
              reference:ref||forLabel||'',
              note:'Paid via payment link'+(ref?(' (ref: '+ref+')'):'')
            })
          }).then(function(res){
            return res.json().catch(function(){ return {}; }).then(function(j){
              if(!res.ok || j.accepted===false){
                console.warn('payment notify rejected (payment still captured):', res.status, j.reason||'');
              }
            });
          });
        }).catch(function(){});
      }catch(e){}
    }

    function markOrderPaid(details){
      // Ask our own server to VERIFY the payment with PayPal and then mark the order Paid.
      // Admin-generated links carry ref = the order's id; manual links without a ref skip
      // this (still paid in PayPal, just no auto-flip). Server-side verification means the
      // browser can't mark anything paid on its own.
      var UUID=/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;
      if(!UUID.test(ref)){ return; }
      try{
        fetch('/api/verify-payment',{
          method:'POST',headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ lead_id:ref, paypal_order_id:(details&&details.id)||'' })
        }).catch(function(){});
      }catch(e){}
    }

    if(!window.paypal){ show('Payment couldn’t load — please refresh the page, or text 559-795-9724.', false); return; }

    paypal.Buttons({
      style:{ layout:'vertical', color:'gold', shape:'rect', label:'paypal' },
      createOrder:function(data,actions){
        msg.className='msg';
        return actions.order.create({
          purchase_units:[{
            description:(forLabel?('Studio One — '+forLabel):'Studio One Hair Design').slice(0,127),
            amount:{ currency_code:'USD', value:value },
            custom_id:(ref||'pay').slice(0,127),
          }],
          application_context:{ shipping_preference:'NO_SHIPPING', user_action:'PAY_NOW', brand_name:'Studio One Hair Design' },
        });
      },
      onApprove:function(data,actions){
        return actions.order.capture().then(function(details){
          notifyStudioOne(details);
          markOrderPaid(details);
          document.getElementById('amountBox').style.display='none';
          document.getElementById('paypal-button-container').style.display='none';
          showHTML('<strong>Payment received — thank you!</strong><br>Your $'+value+' payment to Studio One Hair Design is complete.<br><br>PayPal confirmation: '+String(details.id||'').replace(/[<>&]/g,'')+'', true);
        });
      },
      onError:function(err){ console.error('PayPal error:',err); show('Something went wrong with checkout. Please refresh and try again, or text 559-795-9724.', false); },
      onCancel:function(){},
    }).render('#paypal-button-container');
  })();
  </script>
</body>
</html>
